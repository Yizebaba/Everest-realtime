name: Windy 17 Layers Monitor & WeChat Dispatch

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt apscheduler
          playwright install --with-deps chromium

      - name: Configure Notification & Environment Secrets
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cat <<EOF > .env
          WECHAT_APP_ID=$WECHAT_APP_ID
          WECHAT_APP_SECRET=$WECHAT_APP_SECRET
          WECHAT_TEMPLATE_ID=$WECHAT_TEMPLATE_ID
          R2_ACCOUNT_ID=$R2_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          token=$GH_TOKEN
          EOF

          python - <<'PY'
          import os, json, requests
          appid = os.environ.get('WECHAT_APP_ID', '')
          secret = os.environ.get('WECHAT_APP_SECRET', '')
          tmpl = os.environ.get('WECHAT_TEMPLATE_ID', '')
          users = []
          try:
              tok = requests.get('https://api.weixin.qq.com/cgi-bin/token', params={'grant_type': 'client_credential', 'appid': appid, 'secret': secret}, timeout=10).json().get('access_token', '')
              if tok:
                  users = requests.get('https://api.weixin.qq.com/cgi-bin/user/get', params={'access_token': tok}, timeout=10).json().get('data', {}).get('openid', [])
          except Exception as e:
              print('Fetch users error:', e)
          notify = {
              "wechat": {
                  "app_id": appid,
                  "app_secret": secret,
                  "template_id": tmpl,
                  "touser": users
              }
          }
          with open('config/notify.local.json', 'w', encoding='utf-8') as f:
              json.dump(notify, f, indent=2)
          print('Successfully generated config/notify.local.json with users:', len(users))
          PY

      - name: Run Monitor & WeChat Dispatcher
        run: |
          python monitor.py run --source weather-06 --send
