name: Windy 17 Layers Monitor & WeChat Dispatch

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt apscheduler
          playwright install --with-deps chromium

      - name: Generate Local Environment Config
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cat <<EOF > .env
          WECHAT_APP_ID=$WECHAT_APP_ID
          WECHAT_APP_SECRET=$WECHAT_APP_SECRET
          WECHAT_TEMPLATE_ID=$WECHAT_TEMPLATE_ID
          R2_ACCOUNT_ID=$R2_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          token=$GH_TOKEN
          EOF

      - name: Run Monitor & WeChat Dispatcher
        run: |
          python monitor.py run --source weather-06 --send
