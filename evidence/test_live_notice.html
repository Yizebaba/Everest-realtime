<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>产品名称 · GitHub Pages 专属落地测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 16px 14px;
            line-height: 1.6;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .top-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            color: #38bdf8;
            font-weight: 700;
        }
        .title-link {
            color: #38bdf8;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
        }
        .title-link:hover {
            color: #7dd3fc;
        }
        .multi-tag {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.35);
            font-size: 13px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .meta-line {
            margin-bottom: 10px;
            font-size: 15px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .meta-line:last-child { margin-bottom: 0; }
        .label {
            color: #94a3b8;
            font-weight: 600;
            flex-shrink: 0;
        }
        .source-url {
            color: #38bdf8;
            word-break: break-all;
            text-decoration: underline;
            text-underline-offset: 4px;
            font-weight: 500;
        }
        .source-url:hover {
            color: #7dd3fc;
        }
        .card-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        }
        .layer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            padding: 8px 14px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .layer-name-link {
            color: #38bdf8;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .layer-name-link:hover {
            color: #7dd3fc;
        }
        .layer-index {
            background: #334155;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #020617;
            /* Pure image view: no link wrapping on screenshot */
            cursor: default;
        }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 24px 0 14px;
            border-top: 1px solid #1e293b;
            margin-top: 24px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-panel">
            <div class="title-bar">
                <h1><a class="title-link" href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noopener noreferrer">产品名称 · GitHub Pages 专属落地测试</a></h1>
                <div class="multi-tag">多图层模式 · 共 2 层</div>
            </div>
            <div class="meta-line">
                <span class="label">来源网址：</span>
                <a class="source-url" href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noopener noreferrer">https://worldview.earthdata.nasa.gov/</a>
            </div>
            <div class="meta-line">
                <span class="label">监测时间：</span>
                <span style="color:#f1f5f9;">2026-09-24 18:45:00</span>
            </div>
        </div>

        <div class="cards-stream">
            
        <div class="card-box">
            
            <div class="layer-header">
                <a class="layer-name-link" href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noopener noreferrer" title="点击打开图层对应官方网页">真彩色遥感底图 · MODIS Terra True Color</a>
                <div class="layer-index">图层 1 / 2</div>
            </div>
            
            <div class="img-wrapper">
                <img loading="lazy" src="https://i.ibb.co/Hp4c2fgp/mapview-true-color-modis.png" alt="产品名称 · GitHub Pages 专属落地测试 截图" />
            </div>
            
        </div>
        
        <div class="card-box">
            
            <div class="layer-header">
                <a class="layer-name-link" href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noopener noreferrer" title="点击打开图层对应官方网页">积雪覆盖与冰川反射 · MODIS NDSI Snow Cover</a>
                <div class="layer-index">图层 2 / 2</div>
            </div>
            
            <div class="img-wrapper">
                <img loading="lazy" src="https://i.ibb.co/ksrC91p1/mapview-active-fires-24h.png" alt="产品名称 · GitHub Pages 专属落地测试 截图" />
            </div>
            <div class="footer">vx:No1-Shine ｜ 珠峰自然环境信息监控系统［测试版］</div>
        </div>
        
        </div>
    </div>
</body>
</html>
